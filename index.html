<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jira Git 插件通用拉取工具</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2933; --sub:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand2:#0ea5e9;
    --ok:#16a34a; --warn:#d97706; --err:#dc2626; --chip:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:20px 28px}
  header h1{margin:0;font-size:20px;font-weight:700}
  header p{margin:4px 0 0;opacity:.9;font-size:13px}
  .wrap{max-width:1280px;margin:0 auto;padding:20px;display:grid;
    grid-template-columns:380px 1fr;gap:18px}
  .col{display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:13px;
    font-weight:600;background:var(--brand);color:#fff;transition:.15s}
  button:hover{filter:brightness(1.07)}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:var(--chip);color:var(--brand);font-weight:600;margin-left:6px}
  .badge.ok{background:#dcfce7;color:var(--ok)}
  .badge.warn{background:#fef3c7;color:var(--warn)}
  .badge.err{background:#fee2e2;color:var(--err)}
  .log{background:#0f172a;color:#cbd5e1;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    border-radius:8px;padding:10px;height:160px;overflow:auto;white-space:pre-wrap}
  .tree{font-size:13px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
  .node{margin:1px 0}
  .row-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer}
  .row-item:hover{background:#f1f5f9}
  .row-item.dir{font-weight:600}
  .row-item .tw{width:16px;text-align:center;color:var(--sub)}
  .row-item .cb{margin-left:auto}
  .caret{cursor:pointer;width:14px;display:inline-block;color:var(--sub)}
  .children{margin-left:16px;border-left:1px dashed var(--line);padding-left:6px}
  pre.code{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;
    max-height:460px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre}
  .meta{font-size:12px;color:var(--sub);margin-bottom:8px}
  .hint{font-size:12px;color:var(--sub);margin-top:6px}
  .pill{font-size:11px;padding:1px 7px;border-radius:999px;background:#f1f5f9;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>Jira Git 插件 · 通用代码拉取工具</h1>
  <p>输入连接信息 → 选择仓库 → 浏览文件树 → 克隆 / 下载源码（PAT 全量 · Cookie 抓取）</p>
</header>

<div class="wrap">
  <!-- 左列：连接 + 仓库 -->
  <div class="col">
    <div class="card">
      <h2>① 连接 <span id="mode-badge" class="badge">—</span></h2>
      <label>Jira 基址</label>
      <input id="jira_url" value="https://jira.hcmcloud.cn" />
      <label>用户名</label>
      <input id="username" value="hb_1150118968" />
      <label>鉴权模式</label>
      <select id="mode">
        <option value="pat">PAT（git 克隆，全量）</option>
        <option value="cookie">Cookie（Web 抓取，根文件）</option>
      </select>
      <label>PAT（Personal Access Token）</label>
      <input id="pat" type="password" placeholder="在 Jira 个人设置生成" />
      <label>会话 Cookie（JSESSIONID=...; atlassian.xsrf.token=...）</label>
      <input id="cookie" placeholder="仅 Cookie 模式需要" />
      <div class="row" style="margin-top:12px">
        <button id="btn-connect">测试连接</button>
        <button class="ghost" id="btn-status">刷新状态</button>
      </div>
      <div id="connect-info" class="hint"></div>
    </div>

    <div class="card">
      <h2>② 仓库</h2>
      <label>已发现仓库（点击填入）</label>
      <select id="repo-select"><option value="">— 未发现 / 手动输入 —</option></select>
      <div class="row">
        <div>
          <label>repoId</label>
          <input id="repo_id" value="1032" />
        </div>
        <div>
          <label>分支</label>
          <input id="branch" value="cherry-pick-36e0626c" />
        </div>
      </div>
      <label>仓库名（clone 用，如 hcm_cloud）</label>
      <div class="row">
        <input id="repo_name" placeholder="可留空：Cookie 模式自动探测" />
        <button class="ghost" id="btn-detect" style="flex:0 0 auto">自动探测</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="btn-load">加载文件树</button>
        <button class="ghost" id="btn-clone">PAT 克隆</button>
      </div>
      <div id="repo-info" class="hint"></div>
    </div>

    <div class="card">
      <h2>状态日志</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

  <!-- 右列：树 + 预览 -->
  <div class="col">
    <div class="card">
      <h2>③ 文件树 <span id="tree-badge" class="badge">—</span>
        <span style="margin-left:auto;display:inline-flex;gap:6px">
          <button class="ghost" id="btn-checkall" style="padding:5px 10px;font-size:12px">全选</button>
          <button id="btn-download" style="padding:5px 10px;font-size:12px">下载所选</button>
        </span>
      </h2>
      <div id="tree" class="tree"><span class="hint">先加载文件树…</span></div>
    </div>
    <div class="card">
      <h2>④ 文件预览</h2>
      <div id="file-meta" class="meta">未选择文件</div>
      <pre id="code" class="code">// 点击左侧文件查看内容</pre>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function log(msg, kind=""){
  const el=$("#log");
  const t=new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop=el.scrollHeight;
}
function setBadge(id,text,cls){const e=$(id);e.textContent=text;e.className="badge "+(cls||"");}

async function api(path,opts={}){
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opts));
  if(!r.ok){ let m=""; try{m=(await r.json()).detail||"";}catch(e){} throw new Error(m||("HTTP "+r.status)); }
  return r.json();
}

$("#btn-connect").onclick=async()=>{
  const payload={jira_url:$("#jira_url").value,username:$("#username").value,
    mode:$("#mode").value,pat:$("#pat").value,cookie:$("#cookie").value,
    repo_id:$("#repo_id").value,branch:$("#branch").value};
  $("#btn-connect").disabled=true; log("正在测试连接…");
  try{
    const d=await api("/api/connect",{method:"POST",body:JSON.stringify(payload)});
    let info=`cookie: ${d.cookieOk?"可用✅":"未配置/失效❌"} ｜ PAT: ${d.patProvided?"已填✅":"未填"}`;
    if(d.repoDefaults){info+=`<br>探测到仓库：${d.repoDefaults.displayName||""} (HEAD ${ (d.repoDefaults.headCommit||"").slice(0,8) })`;
      if(d.repoDefaults.displayName)$("#repo_name").value=d.repoDefaults.displayName;}
    if(d.patTest) info+=`<br>PAT 测试：${d.patTest.ok?"成功✅":"失败❌ "+d.patTest.msg}`;
    if(d.note) info+=`<br><span style="color:var(--warn)">${d.note}</span>`;
    $("#connect-info").innerHTML=info;
    setBadge("#mode-badge", payload.mode==="pat"?"PAT 模式":"Cookie 模式", "ok");
    log("连接测试完成");
    if(d.cookieOk || d.patProvided) loadRepos();
  }catch(e){ log("连接失败："+e.message,"err"); }
  finally{$("#btn-connect").disabled=false;}
};

async function loadRepos(){
  try{
    const d=await api("/api/repos");
    const sel=$("#repo-select");
    sel.innerHTML='<option value="">— 未发现 / 手动输入 —</option>';
    (d.repos||[]).forEach(r=>{
      const o=document.createElement("option");
      o.value=JSON.stringify(r); o.textContent=`${r.displayName} (id:${r.repoId})`;
      sel.appendChild(o);
    });
    if((d.repos||[]).length) log(`发现 ${d.repos.length} 个仓库`);
  }catch(e){ log("获取仓库列表失败："+e.message); }
}
$("#repo-select").onchange=e=>{
  if(!e.target.value)return;
  const r=JSON.parse(e.target.value);
  $("#repo_id").value=r.repoId||"";
  if(r.displayName)$("#repo_name").value=r.displayName;
};

$("#btn-detect").onclick=async()=>{
  log("用 Cookie 探测仓库名…");
  try{
    const d=await api("/api/connect",{method:"POST",body:JSON.stringify(currentPayload())});
    if(d.repoDefaults&&d.repoDefaults.displayName){$("#repo_name").value=d.repoDefaults.displayName;
      log("探测到仓库名："+d.repoDefaults.displayName);}
    else log("探测失败：请手动填入仓库名","warn");
  }catch(e){log("探测异常："+e.message);}
};
function currentPayload(){return{jira_url:$("#jira_url").value,username:$("#username").value,
  mode:$("#mode").value,pat:$("#pat").value,cookie:$("#cookie").value,
  repo_id:$("#repo_id").value,branch:$("#branch").value,repo_name:$("#repo_name").value};}

$("#btn-load").onclick=async()=>{
  $("#tree").innerHTML="<span class='hint'>加载中…</span>";
  try{
    const d=await api("/api/tree?path=");
    setBadge("#tree-badge", d.mode==="pat"?"PAT/本地":"Cookie/Web","ok");
    loadRoot();
    log("文件树已加载（懒加载：展开目录即拉取子层）");
  }catch(e){ $("#tree").innerHTML="<span class='hint' style='color:var(--err)'>加载失败："+e.message+"</span>";
    log("树加载失败："+e.message,"err"); }
};

let selected=new Set();

async function loadLevel(path, container, depth){
  container.innerHTML="<span class='hint'>加载中…</span>";
  try{
    const d=await api("/api/tree?path="+encodeURIComponent(path));
    container.innerHTML="";
    if(d.error){ container.innerHTML="<span class='hint' style='color:var(--err)'>"+d.error+"</span>"; return; }
    const entries=d.entries||[];
    if(!entries.length){
      const note = (d.mode==="cookie")
        ? "（该目录内容需 PAT 模式克隆后查看）"
        : "（空目录）";
      container.innerHTML="<span class='hint'>"+note+"</span>"; return;
    }
    for(const e of entries){
      const wrap=document.createElement("div");wrap.className="node";
      const row=document.createElement("div");
      const isDir=e.type==="dir";
      row.className="row-item"+(isDir?" dir":"");
      if(isDir){
        const caret=document.createElement("span");caret.className="caret";caret.textContent="▸";
        const box=document.createElement("div");box.className="children";box.style.display="none";
        row.appendChild(caret);
        row.insertAdjacentHTML("beforeend",`<span class="tw">📁</span><span>${e.name}</span>`);
        caret.onclick=ev=>{ev.stopPropagation();
          if(box.style.display==="none"){
            if(!box.dataset.loaded){ loadLevel(e.path, box, depth+1).then(()=>{box.dataset.loaded="1";}); }
            box.style.display="block";caret.textContent="▾";
          } else { box.style.display="none";caret.textContent="▸"; }
        };
        row.onclick=ev=>{ if(ev.target!==caret) caret.click(); };
        wrap.appendChild(row);wrap.appendChild(box);
      }else{
        row.insertAdjacentHTML("beforeend",`<span class="tw">📄</span><span>${e.name}</span>`);
        const cb=document.createElement("input");cb.type="checkbox";cb.className="cb";
        cb.dataset.path=e.path;
        cb.onchange=()=>{cb.checked?selected.add(e.path):selected.delete(e.path);};
        row.dataset.path=e.path;row.appendChild(cb);
        row.onclick=ev=>{ if(ev.target!==cb) showFile(e.path); };
        wrap.appendChild(row);
      }
      container.appendChild(wrap);
    }
  }catch(e){ container.innerHTML="<span class='hint' style='color:var(--err)'>加载失败："+e.message+"</span>"; }
}

function loadRoot(){ const el=$("#tree"); el.innerHTML=""; loadLevel("", el, 0); }
async function showFile(path){
  $("#file-meta").textContent="加载中："+path;
  try{
    const d=await api("/api/file?path="+encodeURIComponent(path));
    if(d.error){$("#file-meta").textContent=path+" ⚠️ "+d.error;$("#code").textContent="";return;}
    $("#file-meta").textContent=path+"  ·  "+(d.content.length)+" 字符";
    $("#code").textContent=d.content;
  }catch(e){$("#file-meta").textContent=path+" ⚠️ "+e.message;$("#code").textContent="";}
}

$("#btn-checkall").onclick=()=>{
  selected.clear();
  document.querySelectorAll("#tree .row-item input.cb").forEach(cb=>{
    cb.checked=true; selected.add(cb.dataset.path);
  });
  log("已选中全部 "+selected.size+" 个文件");
};

$("#btn-clone").onclick=async()=>{
  $("#btn-clone").disabled=true;log("开始 git 克隆…");
  try{
    const d=await api("/api/clone",{method:"POST",body:JSON.stringify(currentPayload())});
    log(d.ok?("克隆成功 → "+d.local_path):("克隆失败："+d.msg),"err");
    if(d.ok){ // 重新加载本地树（懒加载根层）
      setBadge("#tree-badge","PAT/本地","ok");
      loadRoot();log("本地文件树已加载");
    }
  }catch(e){log("克隆异常："+e.message,"err");}
  finally{$("#btn-clone").disabled=false;}
};

$("#btn-download").onclick=async()=>{
  if(selected.size===0){log("未选择任何文件","warn");return;}
  log("下载 "+selected.size+" 个文件…");
  try{
    const d=await api("/api/download",{method:"POST",
      body:JSON.stringify({paths:[...selected]})});
    log("成功下载 "+d.downloaded.length+" 个 → "+d.dest);
    if(d.failed.length)log("失败 "+d.failed.length+" 个："+d.failed.map(f=>f.path).join(", "),"err");
  }catch(e){log("下载异常："+e.message,"err");}
};

$("#btn-status").onclick=async()=>{
  try{const d=await api("/api/status");
    log("状态："+JSON.stringify(d));
  }catch(e){log("状态获取失败："+e.message);}
};

log("工具已就绪。填好左侧连接信息后点「测试连接」。");
</script>
</body>
</html>
