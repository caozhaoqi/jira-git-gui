# ---------------------------------------------------------------------------
#  双端跨平台发布流水线（Electron + Tauri）
#  触发：推送 main 分支 / v* 标签 / 手动 workflow_dispatch
#  产物：每个 OS 各出 ① 冻结后端（两种壳共用）② Electron 安装包 ③ Tauri 安装包
#  说明：PyInstaller / electron-builder / cargo 均不支持交叉编译，
#        故后端 + Electron + Tauri 必须在各自目标系统上构建（三 runner 分工）。
#  2026-10-16：Windows CI 包出现「Failed to load Python DLL python311.dll」
#        （spec 里 upx=True 压缩 python DLL + strip=True，且未做任何启动冒烟）。
#        修复：spec 关闭 upx/strip；下方每个后端构建后强制拉起可执行并探测
#        /api/status，构建产物真的能用才算发布成功。
#  2026-10-16（第二次）：PyQt6 桌面包从 CI/CD 移除——桌面入口统一收敛到
#        Electron 与 Tauri 两个壳（Tauri 包体积 ~20MB vs Electron ~250MB）。
#        后端冻结产物（pyinstaller_backend.spec）两种壳都依赖，保留不变；
#        仅删去 pyinstaller_gui.spec 的 GUI 构建步骤与对应产物上传。
#        Tauri 构建直接用 npm 版 @tauri-apps/cli（预编译二进制，秒装），
#        不走 `cargo install tauri-cli`（每 job 源码编译 5-10 分钟）。
#        产物目录：tauri/src-tauri/target/release/bundle/{dmg,msi,nsis,appimage,deb}
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # 未配置代码签名证书时禁用自动签名发现，否则 macOS/Windows 打包会因找不到证书而失败。
  # 产物为未签名（ad-hoc），用户首次打开需手动允许（详见 docs/PACKAGING.md）。
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # 所有平台共用这份前端构建产物，避免不同 runner 上独立构建造成 UI 资源差异。
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Tests import TypeScript modules directly; Node 22.18+ enables built-in type stripping.
          node-version: "22"
      - name: Build React frontend
        working-directory: frontend/web-react
        run: npm ci && npm test && npm run build
      - name: Upload shared frontend
        uses: actions/upload-artifact@v4
        with:
          name: shared-frontend
          path: frontend/web-react/dist/
          if-no-files-found: error

  # ===================== macOS =====================
  build-macos:
    runs-on: macos-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: frontend/web-react/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure Apple code signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && [ -z "$KEYCHAIN_PASSWORD" ] && [ -z "$APPLE_SIGNING_IDENTITY" ] && [ -z "$APPLE_ID" ] && [ -z "$APPLE_PASSWORD" ] && [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple signing secrets are not configured; macOS artifacts will be unsigned."
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD, and APPLE_SIGNING_IDENTITY together."
            exit 1
          fi
          if { [ -n "$APPLE_ID" ] || [ -n "$APPLE_PASSWORD" ] || [ -n "$APPLE_TEAM_ID" ]; } && { [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            echo "::error::Set APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID together to enable notarization."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/jgg-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/jgg-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::APPLE_SIGNING_IDENTITY was not found in the imported signing certificate."
            exit 1
          fi
          {
            echo "CSC_LINK=$CERTIFICATE_PATH"
            echo "CSC_KEY_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_ID" ]; then
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            fi
          } >> "$GITHUB_ENV"
      - name: Install Python deps
        # pyinstaller 版本必须固定：云端 CI 现场问题（Windows 上 LoadLibrary 失败）
        # 不允许「装到哪个版本算哪个版本」，保证构建可复现。
        run: python -m pip install --upgrade pip && pip install -r requirements.txt "pyinstaller==6.22.0"
      - name: Validate frozen backend imports
        run: python tests/test_pyinstaller_hiddenimports.py
      - name: Build backend (onefile)
        run: pyinstaller build/pyinstaller_backend.spec --noconfirm
      - name: Smoke test backend (launch + probe /api/status)
        shell: bash
        run: |
          ./dist/jira-git-backend --port 8791 --host 127.0.0.1 > backend-smoke.log 2>&1 &
          BACKEND_PID=$!
          ok=0
          for i in $(seq 1 40); do
            API_TOKEN=$(curl -fsS --max-time 3 http://127.0.0.1:8791/api/auth/token 2>/dev/null) || API_TOKEN=""
            if [ -n "$API_TOKEN" ] && curl -fsS --max-time 3 -H "X-API-Token: $API_TOKEN" http://127.0.0.1:8791/api/status > backend-status.json 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "----- backend log -----"; cat backend-smoke.log || true
          if [ "$ok" = "1" ] && ! python tests/smoke_frontend.py http://127.0.0.1:8791; then ok=0; fi
          kill "$BACKEND_PID" 2>/dev/null || true
          sleep 1
          kill -9 "$BACKEND_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::Backend smoke test failed - frozen exe did not serve API and frontend assets"; exit 1
          fi
          echo "----- /api/status -----"; cat backend-status.json
      - name: Stage backend into Electron / Tauri resources
        run: |
          mkdir -p electron/resources/backend tauri/src-tauri/resources/backend
          cp dist/jira-git-backend electron/resources/backend/jira-git-backend
          cp dist/jira-git-backend tauri/src-tauri/resources/backend/jira-git-backend
      - name: Build Electron (dmg)
        working-directory: electron
        run: |
          npm install
          npm run dist:mac
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build Tauri (app + dmg)
        working-directory: tauri
        run: tauri build
      - name: DMG fallback via hdiutil (tauri 自带 dmg 步骤失败时兜底)
        if: runner.os == 'macOS'
        run: |
          BUNDLE=tauri/src-tauri/target/release/bundle
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1)"
          if [ -n "$APP" ] && ! ls "$BUNDLE"/dmg/*.dmg >/dev/null 2>&1; then
            hdiutil create -volname "JiraGitGUI" -srcfolder "$APP" -ov -format UDZO "$BUNDLE/dmg/$(basename "$APP" .app).dmg"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jira-git-gui-macos
          path: |
            electron/dist-electron/*
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/release/bundle/macos/*.app
            dist/jira-git-backend

  # ===================== Windows =====================
  build-windows:
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: frontend/web-react/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure Windows code signing
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $provided = @($env:WINDOWS_PFX_BASE64, $env:WINDOWS_PFX_PASSWORD, $env:WINDOWS_CERT_THUMBPRINT) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($provided.Count -eq 0) {
            Write-Host "Windows signing secrets are not configured; Windows artifacts will be unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_THUMBPRINT)) {
            throw "Set WINDOWS_PFX_BASE64, WINDOWS_PFX_PASSWORD, and WINDOWS_CERT_THUMBPRINT together."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "jgg-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          $thumbprint = $env:WINDOWS_CERT_THUMBPRINT.Replace(' ', '')
          $certificate = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $thumbprint } |
            Select-Object -First 1
          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            throw "WINDOWS_CERT_THUMBPRINT does not identify a private-key certificate in the imported PFX."
          }
          "CSC_LINK=$pfxPath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_PFX_PASSWORD" >> $env:GITHUB_ENV
          "WINDOWS_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt "pyinstaller==6.22.0"
      - name: Validate frozen backend imports
        run: python tests/test_pyinstaller_hiddenimports.py
      - name: Build backend (onefile)
        run: pyinstaller build/pyinstaller_backend.spec --noconfirm
      - name: Smoke test backend (launch + probe /api/status)
        shell: bash
        run: |
          ./dist/jira-git-backend.exe --port 8791 --host 127.0.0.1 > backend-smoke.log 2>&1 &
          BACKEND_PID=$!
          ok=0
          for i in $(seq 1 40); do
            API_TOKEN=$(curl -fsS --max-time 3 http://127.0.0.1:8791/api/auth/token 2>/dev/null) || API_TOKEN=""
            if [ -n "$API_TOKEN" ] && curl -fsS --max-time 3 -H "X-API-Token: $API_TOKEN" http://127.0.0.1:8791/api/status > backend-status.json 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "----- backend log -----"; cat backend-smoke.log || true
          if [ "$ok" = "1" ] && ! python tests/smoke_frontend.py http://127.0.0.1:8791; then ok=0; fi
          kill "$BACKEND_PID" 2>/dev/null || true
          if command -v taskkill >/dev/null 2>&1; then taskkill //F //PID "$BACKEND_PID" >/dev/null 2>&1 || true; fi
          if [ "$ok" != "1" ]; then
            echo "::error::Backend smoke test failed - frozen exe did not serve API and frontend assets"; exit 1
          fi
          echo "----- /api/status -----"; cat backend-status.json
      - name: Stage backend into Electron / Tauri resources
        shell: bash
        run: |
          mkdir -p electron/resources/backend tauri/src-tauri/resources/backend
          cp dist/jira-git-backend.exe electron/resources/backend/jira-git-backend.exe
          cp dist/jira-git-backend.exe tauri/src-tauri/resources/backend/jira-git-backend.exe
      - name: Build Electron (nsis)
        working-directory: electron
        run: |
          npm install
          npm run dist:win
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build Tauri (msi + nsis)
        working-directory: tauri
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_THUMBPRINT)) {
            tauri build
          } else {
            $config = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WINDOWS_CERT_THUMBPRINT
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Compress -Depth 5
            tauri build --config $config
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jira-git-gui-windows
          path: |
            electron/dist-electron/*
            tauri/src-tauri/target/release/bundle/msi/*.msi
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            dist/jira-git-backend.exe

  # ===================== Linux =====================
  build-linux:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: frontend/web-react/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system libs (Qt WebKit for Tauri / Electron 运行库)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libnss3 libgbm1 libgtk-3-0 libasound2t64 fakeroot dpkg \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt "pyinstaller==6.22.0"
      - name: Validate frozen backend imports
        run: python tests/test_pyinstaller_hiddenimports.py
      - name: Build backend (onefile)
        run: pyinstaller build/pyinstaller_backend.spec --noconfirm
      - name: Smoke test backend (launch + probe /api/status)
        shell: bash
        run: |
          ./dist/jira-git-backend --port 8791 --host 127.0.0.1 > backend-smoke.log 2>&1 &
          BACKEND_PID=$!
          ok=0
          for i in $(seq 1 40); do
            API_TOKEN=$(curl -fsS --max-time 3 http://127.0.0.1:8791/api/auth/token 2>/dev/null) || API_TOKEN=""
            if [ -n "$API_TOKEN" ] && curl -fsS --max-time 3 -H "X-API-Token: $API_TOKEN" http://127.0.0.1:8791/api/status > backend-status.json 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "----- backend log -----"; cat backend-smoke.log || true
          if [ "$ok" = "1" ] && ! python tests/smoke_frontend.py http://127.0.0.1:8791; then ok=0; fi
          kill "$BACKEND_PID" 2>/dev/null || true
          sleep 1
          kill -9 "$BACKEND_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::Backend smoke test failed - frozen exe did not serve API and frontend assets"; exit 1
          fi
          echo "----- /api/status -----"; cat backend-status.json
      - name: Stage backend into Electron / Tauri resources
        run: |
          mkdir -p electron/resources/backend tauri/src-tauri/resources/backend
          cp dist/jira-git-backend electron/resources/backend/jira-git-backend
          cp dist/jira-git-backend tauri/src-tauri/resources/backend/jira-git-backend
          chmod +x electron/resources/backend/jira-git-backend tauri/src-tauri/resources/backend/jira-git-backend
      - name: Build Electron (AppImage + deb)
        working-directory: electron
        run: |
          npm install
          npm run dist:linux
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build Tauri (AppImage + deb)
        working-directory: tauri
        run: tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jira-git-gui-linux
          path: |
            electron/dist-electron/*
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/deb/*.deb
            dist/jira-git-backend
