         移除后排版自动回退到原生字体，且省去运行时网络字体请求（更快、可离线、与 Chromium 版本解耦）。
         若日后确需 DM Sans 等，请改为自托管静态（非可变）字体文件，勿再依赖 CDN 可变字体。 -->
