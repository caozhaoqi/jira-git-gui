<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HCM 元数据浏览器</title>
<style>
  :root{
    /* 统一设计令牌 —— 浅色主壳（与首选项页 services-config 完全一致） */
    --bg:#f4f6fb; --panel:#ffffff; --panel-2:#fafbfe; --border:#e4e8f0;
    --text:#1f2733; --muted:#6b7689;
    --primary:#2f6df0; --primary-d:#1f53c4; --primary-soft:#eaf1fe;
    --danger:#e0454a; --danger-soft:#fde8e8;
    --ok:#18a058; --warn:#e08a00;
    --t-system:#6b7280; --t-program:#2f6df0; --t-manual:#b45309;
    --toast-bg:#1f2733; --on-color:#ffffff;
    --radius:10px; --radius-sm:8px; --radius-lg:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html.dark{
    /* 深色覆盖 —— 与主界面（web-react global.css html.dark）同一套配色 */
    --bg:#16191e; --panel:#1e2227; --panel-2:#252a31; --border:#32383f;
    --text:#e6e9ee; --muted:#9aa3af;
    --primary:#5b95ff; --primary-d:#4b86ff; --primary-soft:#1c3052;
    --danger:#ff6b6b; --danger-d:#e05555; --danger-soft:#3a2326;
    --ok:#3ecf8e; --warn:#f0a831;
    --amber-bg:#3a2f1c; --amber-fg:#f0a831;
    --t-system:#9aa3af; --t-program:#5b95ff; --t-manual:#f0a831;
    --toast-bg:#e6e9ee;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);
       background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  header{padding:16px 22px;background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:19px}
  header p{margin:6px 0 0;color:var(--muted);font-size:12.5px;max-width:920px}
  header a{color:var(--primary);text-decoration:none;font-size:12.5px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px}
  .cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px;align-items:end}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--panel);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,109,240,.15)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
  button{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:600}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:var(--primary-soft);color:var(--primary)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .toolbar input{flex:1;min-width:200px}
  .count{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .count.warn{color:var(--danger);font-weight:600}
  .dist{margin-left:14px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel-2)}
  tr:hover{background:var(--panel-2)}
  .name{font-family:var(--mono);font-size:12.5px;word-break:break-all}
  .name mark, .meta mark{background:#fff3a3;color:#1a1a1a;border-radius:2px;padding:0 1px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:var(--on-color)}
  .b-SYSTEM{background:var(--t-system)} .b-PROGRAM{background:var(--t-program)} .b-MANUAL{background:var(--t-manual)}
  .meta{color:var(--muted);font-size:11.5px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:#fff;
        padding:9px 16px;border-radius:var(--radius-sm);opacity:0;transition:.25s;z-index:50;font-size:13px;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .err{color:var(--danger);font-size:12.5px;margin-top:8px;white-space:pre-wrap}
  .hint{color:var(--muted);font-size:11.5px;margin-top:6px}
  code.k{color:var(--primary)}
</style>
</head>
<body>
<header>
  <h1>HCM 元数据浏览器</h1>
  <p>浏览 HCM 对象的元数据模板（list / info / view 等业务类型），支持按名称搜索、按类型（SYSTEM / PROGRAM / MANUAL）筛选；
     点击任一元数据在新窗口打开其 JSON 内容，便于搜索与排查。列表 / 详情接口名可编辑，默认走通用网关 <code class="k">/api/hcm/direct</code>。</p>
  <a href="/services-config">← 服务配置管理</a>
</header>

<div class="wrap">
  <div class="card">
    <div class="cfg-grid">
      <div>
        <label>服务器环境</label>
        <select id="env"></select>
      </div>
      <div>
        <label>登录 Token（cookie 值）</label>
        <input id="token" type="password" placeholder="留空可用预设 Token" />
      </div>
      <div>
        <label>对象 model（如 Employee）</label>
        <input id="model" value="Employee" placeholder="Employee" />
      </div>
      <div>
        <label>业务类型 biz_type</label>
        <select id="bizType">
          <option value="all">全部</option>
          <option value="list" selected>list</option>
          <option value="info">info</option>
          <option value="view">view</option>
        </select>
      </div>
      <div>
        <label>列表接口名</label>
        <input id="listApi" value="hcm.paas.object.meta" placeholder="hcm.paas.object.meta" />
      </div>
      <div>
        <label>详情接口名（取单条 JSON）</label>
        <input id="detailApi" value="hcm.paas.object.meta" placeholder="同列表接口名" />
      </div>
      <div>
        <label>每页大小 page_size（用于拉全）</label>
        <input id="pageSize" value="2000" placeholder="2000" />
      </div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="usePreset" /> 用预设 Token（环境已配置时留空自动补全）</label>
      <label class="chk"><input type="checkbox" id="demoMode" checked /> 演示数据（离线，无需 HCM 服务器）</label>
      <button class="btn-primary" id="load">加载元数据列表</button>
    </div>
    <div class="hint">提示：演示模式内置一份样本（取自真实返回），用于验证界面与交互；取消勾选并配置好环境/Token 后，点击「加载」即走真实网关。</div>
    <div class="err" id="loadErr"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input id="search" placeholder="搜索名称 / id / key（实时过滤）" />
      <label class="chk"><input type="checkbox" class="tf" value="SYSTEM" checked /> SYSTEM</label>
      <label class="chk"><input type="checkbox" class="tf" value="PROGRAM" checked /> PROGRAM</label>
      <label class="chk"><input type="checkbox" class="tf" value="MANUAL" checked /> MANUAL</label>
      <span class="count" id="count"></span>
      <span class="count dist" id="typeDist"></span>
    </div>
    <table>
      <thead><tr><th style="width:96px">类型</th><th>名称 (name)</th><th>id / key</th><th style="width:160px">更新时间</th><th style="width:90px"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="hint" id="empty">尚未加载。点击「加载元数据列表」。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.className="toast show";
  setTimeout(()=>{ t.className="toast"; }, 2200);
}

/* ---------------- 演示数据（取自真实返回结构，离线可用） ---------------- */
const DEMO_LIST = [
  {type:"SYSTEM", name:"Employee.meta.list.json", id:"Employee.meta.list.json"},
  {type:"PROGRAM", name:"Employee.meta.list.treeListSelector_salaryBatchAdjust.json", id:"Employee.meta.list.treeListSelector_salaryBatchAdjust.json"},
  {type:"PROGRAM", name:"Employee.meta.list.treeListSelector_quit.json", id:"Employee.meta.list.treeListSelector_quit.json"},
  {type:"PROGRAM", name:"Employee.meta.list.handOver.json", id:"Employee.meta.list.handOver.json"},
  {type:"PROGRAM", name:"Employee.meta.list.treeListSelector_trainClass_manager.json", id:"Employee.meta.list.treeListSelector_trainClass_manager.json"},
  {type:"PROGRAM", name:"Employee.meta.list.treeListSelector_title.json", id:"Employee.meta.list.treeListSelector_title.json"},
  {type:"PROGRAM", name:"Employee.meta.list.newSign.json", id:"Employee.meta.list.newSign.json"},
  {type:"PROGRAM", name:"Employee.meta.list.treeListSelector_changeSchedule.json", id:"Employee.meta.list.treeListSelector_changeSchedule.json"},
  {type:"PROGRAM", name:"Employee.meta.list.treeListSelector_salaryAssistEntry_batch.json", id:"Employee.meta.list.treeListSelector_salaryAssistEntry_batch.json"},
  {type:"PROGRAM", name:"Employee.meta.list.laborBillNew.json", id:"Employee.meta.list.laborBillNew.json"},
  {type:"MANUAL", name:"Employee.meta.list.treeListSelector_agent.json", id:"Employee.meta.list.treeListSelector_agent.json", key:"Employee.meta.list.treeListSelector_agent.json", update_time:"2026-07-11 18:29:38"},
  {type:"PROGRAM", name:"Employee.meta.list.echartsCadre_relatives.json", id:"Employee.meta.list.echartsCadre_relatives.json"},
  {type:"PROGRAM", name:"Employee.meta.list.robotAISelect.json", id:"Employee.meta.list.robotAISelect.json"},
  {type:"PROGRAM", name:"Employee.meta.list.emp_profile_edit.json", id:"Employee.meta.list.emp_profile_edit.json"}
];
function demoDetail(item){
  return {
    _demo: true,
    name: item.name,
    type: item.type,
    id: item.id,
    biz_type: (item.name.match(/meta\.(list|info|view)\./)||[])[1] || "list",
    update_time: item.update_time || "2026-07-11 18:29:38",
    columns: [
      {key:"number", name:"工号", width:120, visible:true},
      {key:"name", name:"姓名", width:100, visible:true},
      {key:"dept_id", name:"部门", width:160, visible:true},
      {key:"position", name:"岗位", width:140, visible:false},
      {key:"status", name:"在职状态", width:90, visible:true}
    ],
    actions: ["add","edit","delete","export"],
    treeListSelector: item.name.indexOf("treeListSelector")>=0,
    note:"此为演示内容（离线样本），取消「演示数据」并配置环境/Token 后，将拉取该元数据的真实 JSON。"
  };
}

/* ---------------- 状态 ---------------- */
let ALL = [];
let SYS_COUNT = null;   // 后端返回的系统总数（result.count），用于与已加载条数对照

function currentToken(){
  return $("usePreset").checked ? "" : $("token").value.trim();
}
function activeTypes(){
  const s=new Set();
  document.querySelectorAll(".tf").forEach(c=>{ if(c.checked) s.add(c.value); });
  return s;
}
function listParams(btOverride){
  const p={};
  const m=$("model").value.trim(); if(m) p.model=m;
  const bt = (btOverride!==undefined) ? btOverride : $("bizType").value;
  if(bt && bt!=="all") p.biz_type=bt;
  p.page = 1;
  const ps = parseInt($("pageSize").value,10); if(ps>0) p.page_size = ps;
  return p;
}
// “全部”(all) 时 HCM 网关对空/缺失 biz_type 只返回 1 条默认布局，无法一次拉全；
// 改为按各已知 biz_type 分别拉取后合并去重。
const KNOWN_BIZ_TYPES = ["list","info","view","base","panel","dataset"];

/* ---------------- 工具：稳定 key 与类型归类 ---------------- */
function itemKey(it){
  if(!it) return JSON.stringify(it);
  return it.id || it.key || it.name || JSON.stringify(it);
}
// 归类 list/info/view：优先用网关返回的 meta_key/biz_type/kind/type 字段，
// 否则回退到 name/id/key 中的 ".meta.(list|info|view)" 片段（不要求末尾带点）。
function metaKindOf(it){
  const cand=[it&&it.meta_key, it&&it.biz_type, it&&it.kind, it&&it.type];
  for(const c of cand){ if(c==="list"||c==="info"||c==="view") return c; }
  const hay=[it&&it.name, it&&it.id, it&&it.key].filter(Boolean).join(" ");
  const m=hay.match(/meta\.(list|info|view)/i);
  return m ? m[1].toLowerCase() : "other";
}

/* ---------------- 加载列表（稳健分页 + 去重） ---------------- */
$("load").addEventListener("click", loadList);
async function loadList(){
  $("loadErr").textContent="";
  if($("demoMode").checked){
    ALL = DEMO_LIST.slice();
    SYS_COUNT = ALL.length;
    renderList();
    renderTypeDist();
    toast("已加载演示数据："+ALL.length+" 条");
    return;
  }
  try{
    const apiName = $("listApi").value.trim();
    const ps = parseInt($("pageSize").value,10) || 2000;
    const btSel = $("bizType").value;
    // “全部”(all) 时 HCM 网关对空/缺失 biz_type 只返回 1 条默认布局，无法一次拉全；
    // 改为按各已知 biz_type 分别拉取后合并去重。指定具体类型时只查该类型。
    const typesToQuery = (btSel && btSel!=="all") ? [btSel] : KNOWN_BIZ_TYPES;
    const single = typesToQuery.length===1;
    let acc=[], total=null;
    const seen=new Set();
    let partial=false;   // 系统总数已知却未拉满 → 网关大概率未分页
    for(const bt of typesToQuery){
      let page=1;
      while(true){
        const params = listParams(bt);
        params.page = page; params.page_size = ps;
        const body = { api_name: apiName, params, token: currentToken(), model: $("model").value.trim() };
        const r = await fetch("/api/hcm/direct", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
        const j = await r.json();
        if(!j.ok) throw new Error(JSON.stringify(j, null, 2));
        const d = j.data || {};
        // 兼容两层结构：d.result.{list,count} 或 d.{list,count}
        const res = (d && d.result && typeof d.result==="object") ? d.result : d;
        const pageList = Array.isArray(res) ? res : (res.list || []);
        if(single && total==null){
          const c = (res && res.count!=null) ? res.count : (d && d.count!=null ? d.count : null);
          if(c!=null) total = c;
        }
        // 去重：网关若不认 page/page_size 会反复返回同一页，按 key 去重并据此提前结束，
        // 避免旧逻辑把同一页重复拼接导致「已加载」数字虚高、与系统总数对不上。
        let added=0;
        for(const it of pageList){
          const k = itemKey(it);
          if(seen.has(k)) continue;
          seen.add(k); acc.push(it); added++;
        }
        if(pageList.length===0 || added===0 || page>=50){
          if(single && total!=null && acc.length < total) partial=true;
          break;
        }
        page++;
      }
    }
    ALL = acc;
    // 合并多类型时网关不暴露“系统总数”，置 null 避免误报；单类型用网关 count 对照。
    SYS_COUNT = single ? (total!=null ? total : acc.length) : null;
    renderList();
    renderTypeDist();
    if(single && partial){
      toast("已加载 "+ALL.length+" / 系统 "+SYS_COUNT+" 条 · 网关疑似未分页，仅返回首页");
    }else if(single){
      toast("已加载 "+ALL.length+" / 系统 "+SYS_COUNT+" 条");
    }else{
      toast("已加载 "+ALL.length+" 条（已按各 biz_type 合并）");
    }
  }catch(e){
    $("loadErr").textContent = "加载失败：" + (e.message||e);
  }
}

/* ---------------- 渲染列表 ---------------- */
function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const types = activeTypes();
  const rows = ALL.filter(it=>{
    if(!types.has(it.type)) return false;
    if(!q) return true;
    return [it.name,it.id,it.key].some(v=>(v||"").toLowerCase().includes(q));
  });
  const tb = $("rows");
  tb.innerHTML = "";
  rows.forEach(it=>{
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td><span class="badge b-'+it.type+'">'+it.type+'</span></td>'+
      '<td class="name">'+mark(it.name,q)+'</td>'+
      '<td class="name meta">'+mark(it.key||it.id||"",q)+'</td>'+
      '<td class="meta">'+(it.update_time||"")+'</td>'+
      '<td><button class="btn-ghost btn-sm" data-name="'+esc(it.name)+'">查看 JSON</button></td>';
    tr.querySelector("button").addEventListener("click", ()=> openDetail(it));
    tb.appendChild(tr);
  });
  $("count").textContent = "已加载 "+rows.length+" / 共 "+ALL.length+" 条"+(SYS_COUNT!=null?(" · 系统总数 "+SYS_COUNT):"");
  $("count").classList.toggle("warn", SYS_COUNT!=null && ALL.length < SYS_COUNT);
  $("empty").style.display = ALL.length ? "none" : "block";
}

/* ---------------- 类型分布：list / info / view 与系统数目对应 ---------------- */
function renderTypeDist(){
  const dist={list:0,info:0,view:0,other:0};
  ALL.forEach(it=>{ dist[metaKindOf(it)]++; });
  let txt = "类型分布  list:"+dist.list+"  info:"+dist.info+"  view:"+dist.view;
  if(dist.other) txt += "  其他:"+dist.other;
  if(SYS_COUNT!=null) txt += "  ·  系统共 "+SYS_COUNT+" 条";
  if(SYS_COUNT!=null && ALL.length < SYS_COUNT) txt += "（仅加载首页，未全部拉取，分布可能不全）";
  $("typeDist").textContent = txt;
}

$("search").addEventListener("input", renderList);
document.querySelectorAll(".tf").forEach(c=> c.addEventListener("change", renderList));

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// 文件列表名字段高亮搜索：命中子串包裹 <mark>（先转义防注入）。与 JSON 内容高亮一致。
function mark(s,q){ var safe=esc(s); q=(q||"").trim(); if(!q) return safe; var kw=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return safe.replace(new RegExp("("+kw+")","gi"),"<mark>$1</mark>"); }

/* ---------------- 详情：新窗口 ---------------- */
async function openDetail(item){
  let json;
  if($("demoMode").checked){
    json = demoDetail(item);
  }else{
    try{
      const params = {model:$("model").value.trim(), name:item.name, id:item.id};
      if(item.key) params.key = item.key;
      const body = {api_name:$("detailApi").value.trim(), params, token:currentToken(), model:params.model};
      const r = await fetch("/api/hcm/direct", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      const j = await r.json();
      if(!j.ok) throw new Error(JSON.stringify(j,null,2));
      let d = j.data || {};
      if(d.result) d = d.result;
      if(d.content) d = d.content;
      if(d.meta && typeof d.meta==="object" && !Array.isArray(d.meta)) { /* keep */ }
      json = d;
    }catch(e){
      json = {_error:true, message:String(e.message||e)};
    }
  }
  const w = window.open("", "_blank", "width=1120,height=840");
  w.document.open();
  w.document.write(renderDetailDoc(item, json, $("model").value.trim()));
  w.document.close();
}

/* 注意：内部闭合标签需写成 <\/script> 以免提前关闭外层脚本 */
function renderDetailDoc(item, json, model){
  const detailHtml =
'<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">'+
'<title>'+esc(item.name)+' · 元数据</title>'+
'<style>'+
':root{--v-bg:#0f1420;--v-panel:#161d2e;--v-border:#28324a;--v-text:#e6ebf5;--v-muted:#8b97b5;--v-primary:#2f6df0;--v-primary-soft:#26314d;--v-primary-text:#9fb4ff;--v-key:#7fd1ff;--v-str:#9be59b;--v-num:#ffcf6b;--v-bool:#ff9bd0;--v-null:#c08bff}'+
'body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--v-bg);color:var(--v-text)}'+
'header{padding:12px 16px;background:var(--v-panel);border-bottom:1px solid var(--v-border);position:sticky;top:0;z-index:5}'+
'h1{margin:0;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}'+
'.sub{color:var(--v-muted);font-size:12px;margin-top:4px}'+
'.bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}'+
'input{flex:1;min-width:200px;padding:7px 10px;border-radius:7px;border:1px solid var(--v-border);background:var(--v-bg);color:var(--v-text);font-size:13px}'+
'button{cursor:pointer;border:none;border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;background:var(--v-primary);color:#fff}'+
'button.ghost{background:var(--v-primary-soft);color:var(--v-primary-text)}'+
'pre{margin:0;padding:16px;overflow:auto;height:calc(100vh - 150px);font-size:13px;line-height:1.6}'+
'code{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}'+
'.ln{padding:1px 0}.muted{color:var(--v-muted)}mark{background:#b58900;color:#1a1a1a;border-radius:2px;padding:0 1px}.cnt{color:var(--v-muted);font-size:12px;margin-left:6px}'+
'.key{color:var(--v-key)}.str{color:var(--v-str)}.num{color:var(--v-num)}.bool{color:var(--v-bool)}.null{color:var(--v-null)}'+
'</style></head><body>'+
'<header><h1>'+esc(item.name)+'</h1>'+
'<div class="sub">类型 '+esc(item.type)+' · id '+esc(item.id||"")+(item.update_time?(' · 更新 '+esc(item.update_time)):'')+'</div>'+
'<div class="bar"><input id="ds" placeholder="搜索 JSON（关键字，高亮匹配）" /><span id="mcnt" class="cnt"></span>'+
'<button id="copy">复制</button><button id="save" class="ghost">保存本地</button>'+
'<button id="all" class="ghost">显示全部</button></div></header>'+
'<pre><code id="json"></code></pre>'+
'<script>'+
'const DATA='+JSON.stringify(json)+';'+
'const MODEL='+JSON.stringify(model||"")+';'+
'const raw=JSON.stringify(DATA,null,2);'+
'const lines=raw.split("\\n");'+
'const codeEl=document.getElementById("json");'+
'function e(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}'+
'function hlMark(s,q){if(!q)return s;var kw=e(q).replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&");var re=new RegExp("("+kw+")","gi");return s.replace(/(<[^>]+>)|([^<]+)/g,function(mm,tag,txt){return tag?tag:(txt?txt.replace(re,function(_,k){return "<mark>"+k+"</mark>";}):txt);});}'+
'function hl(s){s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");'+
'return s.replace(/("(?:\\\\u[a-zA-Z0-9]{4}|\\\\[^u]|[^\\\\"])*"(?:\\s*:)?|\\b(?:true|false|null)\\b|-?\\d+(?:\\.\\d*)?(?:[eE][+\\-]?\\d+)?)/g,function(m){'+
'var c="num";if(/^"/.test(m)){c=/:$/.test(m)?"key":"str";}else if(/true|false/.test(m)){c="bool";}else if(/null/.test(m)){c="null";}'+
'return \'<span class="\'+c+\'">\'+m+"</span>";});}'+
'function render(q){if(!q){codeEl.innerHTML=hl(raw);return;}'+
'var f=q.toLowerCase();var out=[];for(var i=0;i<lines.length;i++){if(lines[i].toLowerCase().indexOf(f)>=0){var ln=hl(lines[i]);if(f)ln=hlMark(ln,q);out.push(\'<div class="ln">\'+ln+"</div>");}}'+
'codeEl.innerHTML=out.length?out.join(""):\'<div class="ln muted">无匹配行</div>\';var c=document.getElementById("mcnt");if(c)c.textContent=f?("命中 "+out.length+" 行"):"";}'+
'document.getElementById("ds").addEventListener("input",function(e){render(e.target.value);});'+
'document.getElementById("all").addEventListener("click",function(){document.getElementById("ds").value="";render("");});'+
'document.getElementById("copy").addEventListener("click",function(){navigator.clipboard.writeText(raw).then(function(){alert("已复制");});});'+
'document.getElementById("save").addEventListener("click",function(){'+
'fetch("/api/hcm/data/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,content:raw})})'+
'.then(function(r){return r.json();}).then(function(j){alert(j.ok?("已保存: "+(j.path||j.filename)):"保存失败");}).catch(function(e){alert("保存失败: "+e);});});'+
'render("");'+
'<\/script></body></html>';
  return detailHtml;
}

/* ---------------- 初始化：环境列表 ---------------- */
(async function init(){
  try{
    const r = await fetch("/api/hcm/envs");
    const j = await r.json();
    const sel = $("env");
    (j.envs||[]).forEach(e=>{
      const o=document.createElement("option");
      o.value=e.server_url; o.textContent=e.name+(e.has_preset_token?"（含预设Token）":"");
      sel.appendChild(o);
    });
    if(!((j.envs||[]).length)) sel.innerHTML='<option value="">（未配置 HCM 环境）</option>';
  }catch(e){ /* ignore */ }
  renderList();
})();
</script>
<script>
  /* 主题与主界面保持一致（同源共享 localStorage：jgg-theme），并跟随主界面实时切换 */
  (function () {
    function applyTheme() {
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('jgg-theme') === 'dark');
      } catch (e) {}
    }
    applyTheme();
    window.addEventListener('storage', function (e) { if (!e || e.key === 'jgg-theme') applyTheme(); });
  })();
</script>
